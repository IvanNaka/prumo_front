<section class="unauthorized-page">
	<div class="unauthorized-card" role="alert">
		<p class="unauthorized-code">403</p>
		<h1 class="unauthorized-title">Acesso não autorizado</h1>
		<p class="unauthorized-description">
			Você não tem permissão para acessar esta página. Se você acredita que isso é um erro, entre em
			contato com um administrador.
		</p>
		<button type="button" class="primary-button" (click)="voltarParaDashboard()">
			Voltar para o Dashboard
		</button>
	</div>
</section>
