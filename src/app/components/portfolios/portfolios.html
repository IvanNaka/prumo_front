<section class="page">
  <header class="page-header">
    <div>
      <h1>Portfólios</h1>
    </div>
    <button type="button" class="btn btn-primary" *temPerfil="permissoes.editarPortfolio" (click)="formAberto.set(true)">
      Novo portfólio
    </button>
  </header>

  @if (carregando()) {
    <div class="card empty-state">Carregando portfólios...</div>
  } @else if (portfolios().length === 0) {
    <div class="card empty-state">Nenhum portfólio encontrado.</div>
  } @else {
    <div class="portfolio-grid">
      @for (portfolio of portfolios(); track portfolio.id) {
        <button type="button" class="card portfolio-card" [class.ativo]="ativoId() === portfolio.id" (click)="abrir(portfolio)">
          <div class="row">
            <span [class]="badge(portfolio.status)">{{ rotuloStatus[portfolio.status] }}</span>
            @if (ativoId() === portfolio.id) {
              <span class="badge badge-blue">Ativo</span>
            }
          </div>
          <h2 class="portfolio-name">{{ portfolio.nome }}</h2>
          @if (portfolio.objetivo) {
            <p class="portfolio-goal">{{ portfolio.objetivo }}</p>
          }
          <dl class="portfolio-meta">
            <div>
              <dt>Responsável</dt>
              <dd>{{ portfolio.responsavelNome }}</dd>
            </div>
            <div>
              <dt>Projetos</dt>
              <dd>{{ portfolio.quantidadeProjetos }}</dd>
            </div>
            <div>
              <dt>Critérios</dt>
              <dd>{{ portfolio.quantidadeCriterios }}</dd>
            </div>
          </dl>
        </button>
      }
    </div>
  }

  @if (formAberto()) {
    <app-portfolio-form (salvo)="criado($event)" (fechar)="formAberto.set(false)"></app-portfolio-form>
  }
</section>
